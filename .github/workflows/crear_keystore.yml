name: Crear keystore (una sola vez)

# Genera la llave con la que se firman los bundles que subes a Google Play.
# Se corre UNA vez (Actions -> "Crear keystore (una sola vez)" -> Run workflow).
#
# Antes de correrlo, crea el secreto KEYSTORE_PASSWORD
# (Settings > Secrets and variables > Actions > New repository secret):
# una contraseña de al menos 8 caracteres que tú eliges y guardas bien.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Crea primero el secreto KEYSTORE_PASSWORD."; exit 1; }
          [ "${#KEYSTORE_PASSWORD}" -ge 8 ] || { echo "::error::KEYSTORE_PASSWORD debe tener al menos 8 caracteres."; exit 1; }
          mkdir out
          keytool -genkeypair -v \
            -keystore out/upload-keystore.jks \
            -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Mis Finanzas, O=Personal, C=MX"
          # Versión en texto: es lo que se pega en el secreto KEYSTORE_BASE64
          base64 -w 0 out/upload-keystore.jks > out/keystore_base64.txt

      # Contiene tu llave de firma: se borra solo en 1 día y conviene que el
      # repositorio sea privado. Descárgalo y bórralo de la ejecución.
      - name: Subir keystore como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: keystore-subida
          path: out/
          retention-days: 1
