name: Build APK

# Se ejecuta cada vez que subes cambios a la rama "main"
# y también se puede lanzar manualmente desde la pestaña "Actions" en GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Instala Java (requerido para compilar apps Android)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Instala Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4. Genera las carpetas de la plataforma (android/, etc.) si no existen todavía.
      #    No sobreescribe pubspec.yaml ni lib/main.dart si ya existen.
      - name: Generar plataforma Android
        run: flutter create --platforms android .

      # 5. Actualiza la versión de Kotlin: la que trae la plantilla por defecto
      #    es demasiado vieja para el paquete shared_preferences.
      - name: Actualizar versión de Kotlin
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/' android/settings.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi

      # 6. Corrige un problema conocido: a veces el runner de GitHub descarga
      #    un archivo android.jar corrupto para la plataforma Android 35,
      #    lo que hace fallar el empaquetado de recursos. Lo reinstalamos.
      - name: Reinstalar plataforma Android 35
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name "sdkmanager" 2>/dev/null | head -n 1)
          echo "Usando sdkmanager en: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --uninstall "platforms;android-35" || true
          "$SDKMANAGER" "platforms;android-35"

      # 7. Descarga las dependencias del proyecto
      - name: Instalar dependencias
        run: flutter pub get

      # 8. Compila el APK en modo release
      #    --no-tree-shake-icons: necesario porque los iconos de las categorías
      #    se reconstruyen dinámicamente desde datos guardados (no son constantes).
      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      # 9. Deja el APK disponible para descargar desde la pestaña "Actions"
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
