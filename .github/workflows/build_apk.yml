name: Build APK

# Se ejecuta cada vez que subes cambios a la rama "main"
# y también se puede lanzar manualmente desde la pestaña "Actions" en GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Cambia esto si tu pubspec.yaml queda en otra ruta dentro del repo.
    # Si pubspec.yaml está en la raíz del repositorio, borra esta línea
    # y quita también el "working-directory: ./finanzas_app" de cada paso de abajo.
    defaults:
      run:
        working-directory: ./finanzas_app

    steps:
      # 1. Descarga el código del repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Instala Java (requerido para compilar apps Android)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Instala Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4. Genera las carpetas de la plataforma (android/, etc.) si no existen todavía.
      #    No sobreescribe pubspec.yaml ni lib/main.dart si ya existen.
      - name: Generar plataforma Android
        run: flutter create --platforms android .

      # 5. Descarga las dependencias del proyecto
      - name: Instalar dependencias
        run: flutter pub get

      # 6. Compila el APK en modo release
      - name: Compilar APK
        run: flutter build apk --release

      # 7. Deja el APK disponible para descargar desde la pestaña "Actions"
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: finanzas_app/build/app/outputs/flutter-apk/app-release.apk
