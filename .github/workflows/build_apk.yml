name: Build APK

# Se ejecuta cada vez que subes cambios a la rama "main"
# y también se puede lanzar manualmente desde la pestaña "Actions" en GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Instala Java (requerido para compilar apps Android)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Instala Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4. Descarga las dependencias del proyecto
      - name: Instalar dependencias
        run: flutter pub get

      # 5. Compila el APK en modo release
      - name: Compilar APK
        run: flutter build apk --release

      # 6. Deja el APK disponible para descargar desde la pestaña "Actions"
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
